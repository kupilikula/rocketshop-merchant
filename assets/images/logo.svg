<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <!-- Define the gradient -->
    <defs>
        <linearGradient id="blueGradient" x1="50%" y1="100%" x2="100%" y2="10%">
            <stop offset="0%" style="stop-color: darkblue; stop-opacity: 1" />
            <stop offset="50%" style="stop-color: teal; stop-opacity: 1" />
            <stop offset="100%" style="stop-color: lightblue; stop-opacity: 1" />
        </linearGradient>

    </defs>

    <!-- Draw the circle with the gradient fill and black border -->
    <g>
        <circle cx="50" cy="50" r="48" fill="url(#blueGradient)" stroke="black" stroke-width="4" />
        <svg id="letterK" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
            <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="Kavivanar" font-size="80" fill="white">க</text>
        </svg>
    </g>
</svg>
